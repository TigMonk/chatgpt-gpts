<style>
/* Layout: myyjän työpöytä – yläpalkissa asiakasvalitsin ja välilehdet, alla yksi työtila kerrallaan */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#16203A; --muted:#566079;
  --line:#D5DBE5; --accent:#1F45C8; --accent-ink:#FFFFFF; --gold:#B7791F; --gold-bg:#FBF1DE;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --line:#2A3654; --accent:#7D9BFF; --accent-ink:#0B1020; --gold:#F0B656; --gold-bg:#3A2C12;

:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#172036; --sunk:#0B1020; --ink:#E7ECF6; --muted:#9AA6C0;
  --line:#2A3654; --accent:#7D9BFF; --accent-ink:#0B1020; --gold:#F0B656; --gold-bg:#3A2C12;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.who label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]:hover{color:var(--bg)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .panel{padding:12px;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--body);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.gold{background:var(--gold-bg);color:var(--gold)}
.list{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.citem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.citem .sub{font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

.big{font:800 34px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.ladder{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.step.done .n{background:var(--good);color:var(--surface)}
.step.now{border-color:var(--gold);background:var(--gold-bg)}
.step.now .n{background:var(--gold);color:var(--surface)}
.step p{font-size:13px;color:var(--muted)}
.fact{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.fact:last-child{border-bottom:0}
.fact span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.disc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.disc button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;font:600 13px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px}
.disc button b{font:800 20px var(--display)}
.disc button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;overflow-wrap:anywhere}
.why{border-left:3px solid var(--gold);padding:4px 0 4px 12px;font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.act .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.act .dot.bad{background:var(--bad)} .act .dot.good{background:var(--good)} .act .dot.blue{background:var(--accent)}

.vrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:center}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr) auto}.vrow input{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.note{font-size:13px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
details summary{cursor:pointer;font-weight:600}
.obj{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.obj[open]{border-color:var(--accent)}
.obj > div{margin-top:10px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function daysToBirthday(b){
  if(!b) return null; const p=b.split("-"); if(p.length<3) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  let nx=new Date(now.getFullYear(), +p[1]-1, +p[2]); if(nx<now) nx.setFullYear(now.getFullYear()+1);
  return Math.round((nx-now)/864e5);
}

function buildMessage(c){
  const v=vars(c), p=ui.purpose||STEPS[Math.min(c.stage,9)].p||"tutustu";
  ui.purpose=p;
  const vs=T(v)[p], i=ui.variant%vs.length;
  let body=vs[i];
  const disc=c.disc||"S";
  if(PURP[p].ask) body+=" "+CLOSE[disc];
  if(disc==="D"||disc==="C"||ui.channel==="email"||ui.channel==="linkedin") body=body.replace(/\s?[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"");
  let text=body;
  if(ui.channel==="email"){
    const subj={tutustu:"Pieni huomio",kysy:"Kysymys sinulle",arvo:"Tästä voisi olla hyötyä",onnittelu:"Hyvää syntymäpäivää!",kehu:"Hienoa työtä",esittely:"Esittely",tarina:"Lyhyt tarina",tapaaminen:"Ajatus "+(v.tavoite?"tavoitteeseenne":"teille"),ehdotus:"Ehdotus: "+(v.tuote||c.company),seuranta:"Ehdotuksen jatko",kiitos:"Kiitos!"}[p];
    text=`Aihe: ${subj}\n\n${body}\n\nTerveisin\n${S.me.name||"[nimesi]"}${S.me.company?"\n"+S.me.company:""}`;
  }
  if(ui.channel==="sms") text=body.length>300?body.slice(0,body.lastIndexOf(".",300)+1)||body:body;
  const holes=(text.match(/\[[^\]]+\]/g)||[]);
  return {text,p,holes,count:vs.length,i};
}

/* ---------- Visiotarina ---------- */
function vision(){
  const v=ui.vt, c=cur(), d=c&&c.disc||"I";
  const F=v.rows.filter(r=>r.k==="F"&&r.t), Sx=v.rows.filter(r=>r.k==="S"&&r.t), M=v.rows.filter(r=>r.k==="M"&&r.t);
  const src=r=>r.s?` (${r.s})`:"";
  const y=new Date().getFullYear()+3;
  const parts=[];
  parts.push(`1 · REHELLINEN LÄHTÖKOHTA\nKerron suoraan: tänään ${v.kohde||"kohde"} on ${v.nyky||"[nykytila]"}. Juuri siksi hinta on nyt tämä – ja juuri siksi tässä on mahdollisuus.`);
  if(F.length) parts.push(`2 · MITÄ TIEDETÄÄN VARMASTI\n${F.map(r=>"• "+r.t+src(r)).join("\n")}`);
  if(Sx.length) parts.push(`3 · MITÄ ON SUUNNITTEILLA\n${Sx.map(r=>"• "+r.t+src(r)+" – tämä on suunnitelma, ei vielä valmis").join("\n")}`);
  if(M.length) parts.push(`4 · MITÄ TÄSTÄ VOI TEHDÄ\n${M.map(r=>"• "+r.t).join("\n")}`);
  parts.push(`5 · KUVITTELE VUOSI ${y}\nKuvittele, että ${[...Sx,...M].map(r=>r.t.charAt(0).toLowerCase()+r.t.slice(1)).join(", ")||"[muutokset]"}. ${v.hyoty?"Sinulla on "+v.hyoty+".":""} Muut näkevät tänään vain ${v.nyky?v.nyky.split(",")[0]:"nykytilan"}. Sinä näet sen, mitä tästä tulee.`);
  const disc={D:`Lyhyesti: ostat ennen kuin muut huomaavat muutoksen. Riski on hinnassa jo nyt, potentiaali ei ole.`,
    I:`Ajattele, millainen tarina tästä tulee – sinä olit se, joka näki tämän ensimmäisenä.`,
    S:`Edetään rauhassa: tarkistetaan jokainen kohta yhdessä, ja saat kaikki asiakirjat kotiin luettavaksi.`,
    C:`Kaikki yllä olevat faktat löytyvät lähteistä. Laaditaan kolme skenaariota (huono / perus / hyvä), niin näet riskin ja tuoton numeroina.`}[d];
  parts.push(`6 · SINULLE (${d})\n${disc}`);
  parts.push(`7 · ENSIMMÄINEN PIENI ASKEL\n${v.askel||"[pieni, helppo seuraava askel]"}`);
  const warn=[];
  if(!F.length) warn.push(["bad","Tarinasta puuttuu todistettava fakta. Ilman faktaa visio on pelkkä lupaus – lisää ainakin yksi."]);
  if(M.length>F.length) warn.push(["warn","Mahdollisuuksia on enemmän kuin faktoja. Vahvista tarinaa todisteilla."]);
  Sx.filter(r=>!r.s).forEach(r=>warn.push(["warn",`Suunnitelmalle "${r.t}" ei ole lähdettä. Kerro mistä tieto on, tai merkitse se mahdollisuudeksi.`]));
  if(!warn.length) warn.push(["good","Tarina erottelee faktat, suunnitelmat ja mahdollisuudet. Voit perustella jokaisen väitteen."]);
  return {text:parts.join("\n\n"),warn};
}

Ostajatyyppi: ${seg.name}
Persoona (DISC): ${d?c.disc+" – "+d.name+". "+d.puhu:"ei tiedossa – arvioi tietojen perusteella"}
Päähyöty hänelle: ${c.benefit||"-"}
Suhteen vaihe: ${c.stage+1}/10 – ${STEPS[c.stage].n} (${STEPS[c.stage].goal})

TIEDOT HÄNESTÄ (${c.facts.length}/30):
${facts}

YHTEYDENPIDOT:
${log}

MUISTIINPANOT: ${c.notes||"-"}

Vastaa suomeksi. Kerro lopuksi, mitkä 3 tietoa puuttuvat ja millä kysymyksillä saan ne luontevasti.`;
}
VIEWS.mentori = () => {
  const c=cur(); if(!c) return `<div class="empty">Lisää ensin asiakas.</div>`;
  return `<div class="stack">
    <div class="stack" style="gap:6px"><h1>AI-mentori</h1><p class="lede">Kokoaa kaiken mitä tiedät asiakkaasta yhdeksi ohjeeksi. Liitä se ChatGPT:hen, Claudeen tai Myyntimentori-GPT:hen, niin saat strategian, joka perustuu sinun omaan dataasi. Tekoäly voi myös hakea netistä lisää tietoa.</p></div>
    <div class="panel">
      <div class="row">${Object.entries({strategia:"Kokonaisstrategia",seuraava:"Seuraava askel",viesti:"Kirjoita viestit",tapaaminen:"Valmistaudu tapaamiseen",tutki:"Tutki netistä",visio:"Visiotarina"}).map(([k,l])=>`<button class="btn ${ui.prompt===k?"pri":""}" data-prompt="${k}">${l}</button>`).join("")}</div>
      <textarea id="p_out" style="min-height:320px;font-family:var(--mono);font-size:13px">${esc(bigPrompt(c))}</textarea>
      <div class="row"><button class="btn pri" data-copyprompt>Kopioi ohje</button>
        <a class="btn" target="_blank" rel="noopener" href="https://chatgpt.com/">Avaa ChatGPT</a>
        <a class="btn" target="_blank" rel="noopener" href="https://claude.ai/new">Avaa Claude</a></div>
      <p class="note">Tekoälyn vastauksesta: lisää uudet faktat tietopankkiin, niin seuraava ohje on vielä tarkempi.</p>
    </div></div>`;
};

/* ---------- Opas ---------- */
VIEWS.opas = () => `<div class="stack">
  <div class="stack" style="gap:6px"><h1>Opas</h1><p class="lede">Myyntimentori perustuu yhteen ajatukseen: ihmiset eivät halua tulla myydyiksi, mutta he rakastavat ostaa. Sinun tehtäväsi on ymmärtää heitä niin hyvin, että ostaminen on heidän oma ideansa.</p></div>
  <div class="grid2">
    <div class="panel"><h3>Työtapa</h3><ul class="clean">
      <li><b>Kerää 30 tietoa</b> ennen ehdotusta: perhe, harrastukset, tavoitteet, kipupisteet, päätöksenteko.</li>
      <li><b>Kulje arvoportaat:</b> anna, kysy, auta, muista, kerro tarina – ja vasta sitten ehdota.</li>
      <li><b>Tunnista persoona</b> (DISC) ja puhu hänen kieltään, älä omaasi.</li>
      <li><b>Perustele kaikki.</b> Jokaisen väitteen takana on fakta, lähde tai tarina.</li>
      <li><b>Kirjaa jokainen kontakti</b>, niin Tänään-näkymä kertoo kenelle ottaa yhteyttä.</li></ul></div>
    <div class="panel"><h3>Rehellisyys on kilpailuetu</h3><ul class="clean">
      <li>Visio on sallittu, valhe ei. Erota fakta, suunnitelma ja mahdollisuus.</li>
      <li>Älä painosta haavoittuvassa asemassa olevia ihmisiä.</li>
      <li>Kerää vain tietoja, joita hän itse jakaa tai jotka ovat julkisia. Asiakastiedot ovat henkilötietoja (GDPR).</li>
      <li>Huippumyyjän paras myyntikanava on tyytyväinen asiakas, joka suosittelee.</li></ul></div>
  </div>
  <div class="panel"><h3>Omat tiedot</h3><div class="fgrid">
    <label class="f">Oma nimi<input id="me_name2" data-me="name" value="${esc(S.me.name)}"></label>
    <label class="f">Oma yritys<input id="me_company2" data-me="company" value="${esc(S.me.company)}"></label>
    <label class="f">Mitä myyt yleensä<input id="me_product2" data-me="product" value="${esc(S.me.product)}"></label></div></div>
  <div class="panel"><h3>Varmuuskopio</h3>
    <p class="note">Tiedot tallentuvat vain tähän selaimeen. Kopioi varmuuskopio talteen tai siirrä toiselle laitteelle liittämällä se tähän kenttään.</p>
    <textarea id="backup" style="font-family:var(--mono);font-size:12px" placeholder="Liitä varmuuskopio tähän ja paina Palauta"></textarea>
    <div class="row"><button class="btn" data-export>Näytä ja kopioi varmuuskopio</button><button class="btn" data-import>Palauta varmuuskopiosta</button>
      ${S.contacts.some(c=>c.example)?`<button class="btn" data-clearex>Poista esimerkkiasiakkaat</button>`:""}</div></div>
</div>`;

/* ===================== TAPAHTUMAT ===================== */
function go(t,id,p){ tab=t; if(id) S.current=id; if(p){ui.purpose=p;ui.variant=0;} try{localStorage.setItem(KEY+".tab",t);}catch(e){} save(); render(); window.scrollTo(0,0); }
document.addEventListener("click", e => {
  const b=e.target.closest("button"); if(!b) return;
  const c=cur(), ds=b.dataset;
  if(ds.tab) return go(ds.tab);
  if(ds.go){ const g=JSON.parse(ds.go); return go(g[0],g[1],g[2]); }
  if(ds.pick){ S.current=ds.pick; save(); return render(); }
  if("new" in ds){ const n={id:uid(),name:"Uusi asiakas",company:"",role:"",seg:"pienyrittaja",size:"",industry:"",phone:"",email:"",birthday:"",disc:"",stage:0,product:S.me.product||"",benefit:"",notes:"",facts:[],log:[]};
    S.contacts.push(n); S.current=n.id; tab="asiakas"; save(); render(); setTimeout(()=>{const i=$("#c_name"); i&&(i.focus(),i.select());},0); return; }
  if(ds.del){ if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Vahvista poisto"; b.classList.remove("ghost"); return; }
    S.contacts=S.contacts.filter(x=>x.id!==ds.del); S.current=S.contacts[0]?.id; save(); return render(); }
  if("addfact" in ds){ const t=$("#f_txt").value.trim(); if(!t) return; c.facts.push({c:$("#f_cat").value,t}); save(); render(); $("#f_txt").focus(); return; }
  if(ds.delfact){ c.facts.splice(+ds.delfact,1); save(); return render(); }
  if(ds.disc){ c.disc=ds.disc; save(); return render(); }
  if(ds.stage!==undefined){ c.stage=+ds.stage; save(); return render(); }
  if("addlog" in ds){ const t=$("#l_txt").value.trim(); if(!t) return; c.log.push({d:today(),ch:$("#l_ch").value,t}); save(); return render(); }
  if("variant" in ds){ ui.variant++; return render(); }
  if("copyout" in ds) return copy($("#m_out").value);
  if("logmsg" in ds){ const ch={whatsapp:"WhatsApp",sms:"Tekstiviesti",email:"Sähköposti",linkedin:"LinkedIn"}[ui.channel];
    c.log.push({d:today(),ch,t:PURP[ui.purpose].n+": "+$("#m_out").value.slice(0,120)}); save(); toast("Kirjattu historiaan"); return render(); }
  if("addrow" in ds){ ui.vt.rows.push({k:"M",t:"",s:""}); return render(); }
  if(ds.delrow){ ui.vt.rows.splice(+ds.delrow,1); return render(); }
  if("copyvt" in ds) return copy(vision().text);
  if(ds.copyobj) return copy(OBJ[+ds.copyobj].r+"\n\n"+OBJ[+ds.copyobj].ask);
  if(ds.prompt){ ui.prompt=ds.prompt; return render(); }
  if("copyprompt" in ds) return copy($("#p_out").value);
  if("export" in ds){ const j=JSON.stringify(S); $("#backup").value=j; copy(j); return; }
  if("import" in ds){ try{ const n=JSON.parse($("#backup").value); if(!Array.isArray(n.contacts)) throw 0; S=n; save(); toast("Palautettu"); render(); }catch(err){ toast("Varmuuskopio ei kelpaa – tarkista että liitit koko tekstin"); } return; }
  if("clearex" in ds){ S.contacts=S.contacts.filter(x=>!x.example); S.current=S.contacts[0]?.id; save(); toast("Esimerkit poistettu"); return render(); }
});
document.addEventListener("input", e => {
  const el=e.target, ds=el.dataset, c=cur();
  if(ds.c && c){ c[ds.c]=el.value; save();
    if(ds.c==="name"){ const o=$(`#curSel option[value="${c.id}"]`); if(o) o.textContent=el.value; } return; }
  if(ds.me){ S.me[ds.me]=el.value; save(); return; }
  if(ds.ui==="aihe"){ ui.aihe=el.value; const m=buildMessage(c); $("#m_out").value=m.text; const w=$("#waLink"); if(w){ const ph=(c.phone||"").replace(/[^\d+]/g,"").replace(/^0/,"+358").replace(/^\+/,""); w.href=`https://wa.me/${ph}?text=${encodeURIComponent(m.text)}`; } return; }
  if(ds.vt){ ui.vt[ds.vt]=el.value; refreshVision(); return; }
  if(ds.vrow!==undefined){ ui.vt.rows[+ds.vrow][ds.k]=el.value; refreshVision(); return; }
});
function refreshVision(){ const o=vision(); $("#vt_out").textContent=o.text; $("#vt_warn").innerHTML=warnHtml(o.warn); }
document.addEventListener("change", e => {
  const el=e.target, ds=el.dataset, c=cur();
  if(el.id==="curSel"){ S.current=el.value; save(); return render(); }
  if(ds.c==="seg"||ds.c==="birthday"||ds.c==="phone"){ c[ds.c]=el.value; save(); return render(); }
  if(ds.ui==="purpose"){ ui.purpose=el.value; ui.variant=0; return render(); }
  if(ds.ui==="channel"){ ui.channel=el.value; return render(); }
  if(ds.vrow!==undefined && el.tagName==="SELECT"){ ui.vt.rows[+ds.vrow].k=el.value; return refreshVision(); }
  if(ds.me && tab==="tanaan" && S.me.name){ render(); }
});
document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="f_txt"){ e.preventDefault(); document.querySelector("[data-addfact]").click(); }
  if(e.target.id==="l_txt"){ e.preventDefault(); document.querySelector("[data-addlog]").click(); }
});
render();
</script>
