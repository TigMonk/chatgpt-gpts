<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pikkuhetki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: yksi puhelimen levyinen pelipalsta, tahmea yläpalkki, alanavigaatio, peli avautuu koko ruudun kerrokseksi */
:root{
  --bg:#FFF3F5; --surface:#FFFFFF; --surface2:#FFE6EC; --ink:#3A1F3D; --muted:#86688A; --line:#F0D6DF;
  --accent:#E8336B; --accent-ink:#FFFFFF; --mint:#1FA896; --sun:#FFB627; --sky:#3C8DDB; --bad:#D9363E;
  --paper:#FFFFFF; --paper-ink:#3A1F3D;
  --shadow:0 6px 0 #EBC3D0;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1120; --surface:#2A1A2E; --surface2:#3A2340; --ink:#FBEFF4; --muted:#BFA2C3; --line:#45304B;
  --accent:#FF5C8D; --accent-ink:#2A0C17; --mint:#3ED2BD; --sun:#FFC64F; --sky:#6AAEF0; --bad:#FF6B72;
  --paper:#FBF1F5; --paper-ink:#3A1F3D; --shadow:0 6px 0 #120914; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1D1120; --surface:#2A1A2E; --surface2:#3A2340; --ink:#FBEFF4; --muted:#BFA2C3; --line:#45304B;
  --accent:#FF5C8D; --accent-ink:#2A0C17; --mint:#3ED2BD; --sun:#FFC64F; --sky:#6AAEF0; --bad:#FF6B72;
  --paper:#FBF1F5; --paper-ink:#3A1F3D; --shadow:0 6px 0 #120914; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
.app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100%}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:8px;flex:1 1 140px;min-width:0}
.lvl-badge{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.lvl-bar{flex:1;min-width:0}
.lvl-bar small{display:block;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2)}}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:16px}
/* views */
.view{display:grid;gap:16px;padding-top:6px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .big{font-size:58px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.hero .eyebrow{font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:28px;line-height:1.05}
.hero p{margin:4px 0 10px;font-weight:700;opacity:.92}
.x2{position:absolute;right:14px;top:14px;background:var(--sun);color:var(--paper-ink);font-family:var(--f-display);font-size:16px;padding:3px 10px;border-radius:99px;transform:rotate(6deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:900;border-radius:16px;padding:12px 18px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn.sun{background:var(--sun);color:var(--paper-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn:disabled{opacity:.45;pointer-events:none}
.hero .btn{background:var(--paper);color:var(--paper-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:8px;text-align:left}
.card h3{font-size:18px}
.card .sub{color:var(--muted);font-weight:700;font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:24px}
.sec-h span{color:var(--muted);font-weight:800;font-size:13px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 6px 10px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.tile .em{font-size:34px;line-height:1.1}
.tile b{font-size:13px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.tile .st{font-size:12px;letter-spacing:1px;color:var(--line)}
.tile .st .on{color:var(--sun)}
.tile.locked{background:var(--surface2);border-style:dashed}
.tile.locked .em{filter:grayscale(1);opacity:.35}
.tile .lock{position:absolute;inset:auto 0 8px;font-size:11px;font-weight:900;color:var(--muted)}
.tile .new{position:absolute;top:-7px;right:-4px;background:var(--mint);color:#fff;font-size:10px;font-weight:900;letter-spacing:.06em;padding:2px 7px;border-radius:99px;text-transform:uppercase}
.tile .cat{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:8px 4px 10px;display:grid;justify-items:center;gap:0;font-weight:900;font-size:12px;color:var(--muted);position:relative}
.nav button span{font-size:22px}
.nav button[aria-current="true"]{color:var(--accent)}
.dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center}
/* wheel */
.wheelbox{display:grid;justify-items:center;gap:14px;padding:16px 0 8px;overflow:hidden}
.wheel-wrap{position:relative;width:min(320px,86vw);aspect-ratio:1;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 8px 0 var(--line);transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 0 var(--bg))}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--surface);border:4px solid var(--ink);display:grid;place-items:center;font-size:24px}
.note{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.shop{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
/* missions */
.mission{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px}
.mission .ic{font-size:28px}
.mission .grow{flex:1;min-width:0}
.mission b{display:block}
.mission.done{border-color:var(--mint)}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.streak div{background:var(--surface2);border-radius:12px;padding:6px 2px;text-align:center;font-weight:900;font-size:12px;color:var(--muted)}
.streak div.on{background:var(--sun);color:var(--paper-ink)}
.streak div.today{outline:3px solid var(--accent)}
/* coupons */
.coupon{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:2px dashed var(--accent);border-radius:18px;padding:14px;position:relative}
.coupon .em{font-size:36px}
.coupon .off{font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1.1}
.coupon .code{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--surface2);padding:3px 8px;border-radius:8px;user-select:all;font-size:14px}
.coupon.used{opacity:.5;border-color:var(--line)}
.coupon .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.coupon .acts .btn{padding:8px 12px;font-size:13px}
.demo{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty .em{font-size:48px}
/* game overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-top{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:540px;width:100%;margin:0 auto}
.ov-top h2{flex:1;font-size:20px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:900;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:6px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:540px;width:100%;margin:0 auto;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ginfo{font-weight:900;color:var(--muted);text-align:center;min-height:22px}
.intro{display:grid;justify-items:center;gap:10px;text-align:center;max-width:360px}
.intro .em{font-size:84px;line-height:1}
.intro h2{font-size:34px}
.intro p{margin:0;font-weight:700;color:var(--muted)}
.goals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.goals span{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}
.result .stars{font-size:52px;letter-spacing:6px;color:var(--line)}
.result .stars i{font-style:normal;display:inline-block}
.result .stars i.on{color:var(--sun);animation:starIn .5s both}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.result .score{font-family:var(--f-display);font-size:56px;line-height:1}
.rewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rewards span{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:900}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* generic game parts */
.board{display:grid;gap:6px;width:min(100%,420px);touch-action:none}
.cell{aspect-ratio:1;background:var(--surface);border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:clamp(18px,6vw,30px);font-weight:900;transition:transform .12s,background .15s;min-width:0;padding:0;color:var(--ink)}
.cell:active{transform:scale(.94)}
.cell.sel{background:var(--surface2);border-color:var(--accent);transform:scale(1.06)}
.cell.pop{animation:pop .25s forwards}
@keyframes pop{to{transform:scale(0);opacity:0}}
.cell.hit{background:var(--mint);border-color:var(--mint);color:#fff}
.cell.miss{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.dim{opacity:.35}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,420px)}
.choice .btn{padding:16px 10px;font-size:17px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:22px;padding:22px 18px;min-height:120px;display:grid;place-items:center;text-align:center;width:min(100%,420px);font-family:var(--f-display);font-size:clamp(28px,9vw,44px);box-shadow:var(--shadow)}
.area{position:relative;width:min(100%,440px);flex:1;min-height:300px;max-height:560px;background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden;touch-action:none}
.bubble{position:absolute;bottom:-70px;width:58px;height:58px;border-radius:50%;font-size:30px;display:grid;place-items:center;background:color-mix(in srgb,var(--sky) 22%,transparent);border:2px solid color-mix(in srgb,var(--sky) 50%,transparent);animation:rise linear forwards}
.bubble.gold{background:color-mix(in srgb,var(--sun) 40%,transparent);border-color:var(--sun)}
@keyframes rise{to{transform:translateY(calc(-1 * var(--h)))}}
.target{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 18%,var(--accent) 19% 38%,var(--paper) 39% 58%,var(--accent) 59%);animation:shrink linear forwards}
@keyframes shrink{from{transform:scale(1)}to{transform:scale(0)}}
.pad{width:min(100%,420px);aspect-ratio:1.2;border-radius:26px;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:#fff;text-align:center;padding:16px;max-height:52vh}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.ltile{min-width:46px;height:52px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-size:24px;padding:0 8px}
.ltile.used{visibility:hidden}
.answer{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-family:var(--f-display);font-size:30px;letter-spacing:.06em}
.cvwrap canvas{display:block;border-radius:22px;border:2px solid var(--line);background:var(--surface);touch-action:none;max-width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px}
.dpad button{background:var(--surface);border:2px solid var(--line);border-radius:12px;font-size:20px}
.dots{position:relative;aspect-ratio:1;background:var(--surface);border:2px solid var(--line);border-radius:20px}
.dots i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);margin:-7px 0 0 -7px}
.dots.b i{background:var(--mint)}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px}
.modal-box{background:var(--surface);border-radius:26px;padding:22px 18px;width:min(100%,380px);display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:var(--shadow);animation:in .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{transform:scale(.7);opacity:0}}
.modal-box .em{font-size:64px;line-height:1}
.modal-box h2{font-size:28px}
.modal-box p{margin:0;font-weight:700;color:var(--muted)}
.scratch{position:relative;width:260px;height:150px;max-width:100%;border-radius:18px;overflow:hidden;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;text-align:center;padding:10px}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.float{position:absolute;font-family:var(--f-display);font-size:22px;color:var(--accent);pointer-events:none;animation:floatUp .8s forwards;text-shadow:0 2px 0 var(--surface)}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:360px){.games{grid-template-columns:repeat(2,1fr)}.duo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="lvl">
      <div class="lvl-badge" id="lvlNum">1</div>
      <div class="lvl-bar"><small id="lvlTxt">Taso 1 · 0/100 XP</small><div class="bar"><i id="xpBar" style="width:0"></i></div></div>
    </div>
    <div class="pills">
      <span class="pill" id="pCoins" title="Kolikot">🪙 <b id="coins">0</b></span>
      <span class="pill" id="pStreak" title="Päiväputki">🔥 <b id="streakN">0</b></span>
    </div>
    <button class="iconbtn" id="sound" aria-label="Äänet päälle tai pois">🔊</button>
  </header>

  <main id="views">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-wheel" hidden></section>
    <section class="view" id="v-tasks" hidden></section>
    <section class="view" id="v-coupons" hidden></section>
  </main>
</div>

<nav class="nav"><div class="nav-in">
  <button data-v="home" aria-current="true"><span>🎮</span>Pelit</button>
  <button data-v="wheel"><span>🎡</span>Onnenpyörä<i class="dot" id="dWheel" hidden></i></button>
  <button data-v="tasks"><span>✅</span>Tehtävät<i class="dot" id="dTasks" hidden></i></button>
  <button data-v="coupons"><span>🎟️</span>Kupongit<i class="dot" id="dCoup" hidden></i></button>
</div></nav>

<div class="ov" id="ov" hidden>
  <div class="ov-top">
    <button class="iconbtn" id="ovClose" aria-label="Lopeta peli">✕</button>
    <h2 id="ovTitle">Peli</h2>
    <span class="chip" id="ovTime" hidden>0</span>
    <span class="chip" id="ovScore">0</span>
  </div>
  <div class="stage" id="stage"></div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* ---------- apurit ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function seedRand(str){let x=0;for(const ch of str)x=(x*31+ch.charCodeAt(0))>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- tila ---------- */
const KEY="pikkuhetki-v1";
const DEF={coins:150,xp:0,level:1,stars:{},best:{},plays:{},streak:0,lastDay:null,spins:1,coupons:[],chest:0,unlocked:{},today:{},sound:true,playMs:{}};
let S;
function load(seed){let d=seed||null;if(!d){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}}S=Object.assign(structuredClone(DEF),d||{})}

function gMatch3(st,c){const N=7,T=["🍓","🍋","🫐","🍏","🍊"];let b=[],sel=-1,busy=false,moves=22,combo=1;const r=()=>rnd(T.length);
 for(let i=0;i<N*N;i++){let v;do{v=r()}while((i%N>=2&&b[i-1]===v&&b[i-2]===v)||(i>=2*N&&b[i-N]===v&&b[i-2*N]===v));b[i]=v}

 for(let i=0;i<N*N;i++){const e=h("button","cell");e.dataset.i=i;e.style.fontSize="clamp(18px,7vw,32px)";cells.push(e);grid.append(e)}
 const render=(cl=new Set())=>cells.forEach((e,i)=>{e.textContent=b[i]<0?"":T[b[i]];e.classList.toggle("sel",i===sel);e.classList.toggle("pop",cl.has(i))});
 function matches(){const s=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;){let k=x;while(k<N&&b[y*N+k]===b[y*N+x]&&b[y*N+x]>=0)k++;if(k-x>=3)for(let j=x;j<k;j++)s.add(y*N+j);x=Math.max(k,x+1)}
  for(let x=0;x<N;x++)for(let y=0;y<N;){let k=y;while(k<N&&b[k*N+x]===b[y*N+x]&&b[y*N+x]>=0)k++;if(k-y>=3)for(let j=y;j<k;j++)s.add(j*N+x);y=Math.max(k,y+1)}return s}
 const adj=(a,q)=>(Math.abs(a-q)===1&&Math.floor(a/N)===Math.floor(q/N))||Math.abs(a-q)===N;
 const sw=(a,q)=>{[b[a],b[q]]=[b[q],b[a]]};
 function hasMove(){for(let i=0;i<N*N;i++)for(const q of[i+1,i+N]){if(q>=N*N||!adj(i,q))continue;sw(i,q);const m=matches().size;sw(i,q);if(m)return true}return false}
 function step(){const m=matches();if(!m.size){busy=false;combo=1;upd();if(moves<=0){c.after(500,c.end);return}if(!hasMove()){shuffle(b);if(matches().size||!hasMove())return step();render();upd("Sekoitetaan…")}return}
  c.add(m.size*10*combo);if(combo>1)upd(["","","Makeaa! ×2","Herkullista! ×3","Sokerihumala! ×4","SUPER! ×"+combo][Math.min(combo,5)]||"SUPER!");if(m.size>=5){moves++;upd("5 suora! +1 siirto")}combo++;render(m);buzz(10);
  c.after(260,()=>{m.forEach(i=>b[i]=-1);for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--){const v=b[y*N+x];if(v>=0){b[w*N+x]=v;w--}}for(;w>=0;w--)b[w*N+x]=r()}render();c.after(220,step)})}
 function trySwap(a,q){if(busy||!adj(a,q))return;sw(a,q);if(!matches().size){sw(a,q);cells[a].classList.add("shake");cells[q].classList.add("shake");setTimeout(()=>{cells[a].classList.remove("shake");cells[q].classList.remove("shake")},300);sfx.bad();sel=-1;render();return}sel=-1;moves--;busy=true;render();step()}

 render()}

 b.forEach((v,i)=>{const e=h("button","cell");const x=i%4,y=Math.floor(i/4);e.style.margin=`${y===2?"6px":"0"} 0 0 ${x===2?"6px":"0"}`;if(givens.has(i)){e.style.background=css("--surface2");e.disabled=true}const draw=()=>e.textContent=F[b[i]];draw();e.onclick=()=>{b[i]=(b[i]+1)%5;draw();sfx.pop();if(ok()){c.set(Math.max(200,1000-Math.round((Date.now()-t0)/1000)*8));sfx.win();c.after(600,c.end)}};gr.append(e)});st.append(h("p","note","Napauta ruutua vaihtaaksesi hedelmää. Jokainen hedelmä kerran per rivi, sarake ja kulmaruutu."))}

function gPattern(st,c){let lvl=1,lives=2,target,found,lock=true;const N=4;const gr=board(st,N);gr.style.width="min(100%,340px)";const cells=[];for(let i=0;i<16;i++){const e=h("button","cell");e.onclick=()=>tap(i);cells.push(e);gr.append(e)}
 const round=()=>{lock=true;found=new Set();cells.forEach(e=>{e.className="cell"});target=new Set(shuffle([...Array(16).keys()]).slice(0,Math.min(12,lvl+2)));c.info("Muista ruudut · taso "+lvl+" · "+"❤️".repeat(lives));target.forEach(i=>cells[i].classList.add("hit"));c.after(900+lvl*150,()=>{cells.forEach(e=>e.className="cell");lock=false;c.info("Napauta muistamasi "+target.size+" ruutua")})};
 const tap=i=>{if(lock||found.has(i))return;if(target.has(i)){found.add(i);cells[i].classList.add("hit");sfx.pop();if(found.size===target.size){lock=true;c.set(lvl);lvl++;sfx.good();c.after(600,round)}}else{cells[i].classList.add("miss");lives--;sfx.bad();lock=true;if(lives<=0){target.forEach(j=>cells[j].classList.add("hit"));c.after(1000,c.end)}else c.after(800,round)}};round()}

function gAim(st,c){const a=h("div","area");st.append(a);c.countdown(30);c.info("Osu tauluihin ennen kuin ne katoavat");let life=1.5;
 const spawn=()=>{const t=h("button","target");t.setAttribute("aria-label","Taulu");t.style.left=(40+Math.random()*(a.clientWidth-80))+"px";t.style.top=(40+Math.random()*(a.clientHeight-80))+"px";t.style.animationDuration=life+"s";t.onpointerdown=e=>{e.stopPropagation();const r=a.getBoundingClientRect();c.add(1,a,e.clientX-r.left,e.clientY-r.top);t.remove();life=Math.max(.75,life-.03);spawn()};t.onanimationend=()=>{t.remove();spawn()};a.append(t)};spawn();c.after(6000,spawn)}

function gMore(st,c){c.countdown(30);c.info("Kummassa on enemmän pisteitä?");const row=h("div","choice");row.style.gridTemplateColumns="1fr 1fr";st.append(row);let lvl=0;
 const fill=(el,n)=>{el.replaceChildren();const used=[];for(let k=0;k<n;k++){let x,y,tries=0;do{x=10+Math.random()*80;y=10+Math.random()*80;tries++}while(tries<40&&used.some(([a,b])=>Math.hypot(a-x,b-y)<11));used.push([x,y]);const d=h("i");d.style.left=x+"%";d.style.top=y+"%";el.append(d)}};
 const L=h("button","dots"),R=h("button","dots b");L.setAttribute("aria-label","Vasen");R.setAttribute("aria-label","Oikea");row.append(L,R);let big;
 const nx=()=>{const a=6+rnd(10),diff=Math.max(1,4-Math.floor(lvl/5))+rnd(2);const b=a+diff;big=Math.random()<.5?"L":"R";fill(L,big==="L"?b:a);fill(R,big==="R"?b:a)};
 const ans=s=>{if(s===big){c.add(1,row);lvl++}else{c.add(-1,row);row.classList.add("shake");setTimeout(()=>row.classList.remove("shake"),300)}nx()};L.onclick=()=>ans("L");R.onclick=()=>ans("R");c.key(e=>{if(e.key==="ArrowLeft")ans("L");if(e.key==="ArrowRight")ans("R")});nx()}

function gEmoji(st,c){const Q=[["🧖‍♀️🔥💧","Sauna"],["☕🥐","Aamupala"],["🎄🎅","Joulu"],["🌧️☂️","Sadepäivä"],["🍓🍰","Mansikkakakku"],["🐝🍯","Hunaja"],["🏖️🌊","Rantapäivä"],["🎂🎉","Syntymäpäivä"],["❄️⛄","Lumiukko"],["🍿🎬","Leffailta"],["🛒🥕","Kauppareissu"],["🧺🌳","Piknik"],["👰🤵💍","Häät"],["🎣🐟","Kalastus"],["🧘‍♀️🌅","Aamujooga"],["🍕🛋️","Pizzailta"],["🚲☀️","Pyöräretki"],["📚☕","Lukuhetki"],["🐣🌷","Pääsiäinen"],["🎤🎶","Karaoke"],["🧁👩‍🍳","Leipominen"],["🍂🍄","Sienimetsä"],["🔥🌭","Makkaranpaisto"],["💤🛏️","Päiväunet"],["🚗🗺️","Automatka"],["🎁🎀","Lahja"]];const qs=shuffle(Q.slice()).slice(0,10);let k=0;
 const p=h("div","paper");p.style.fontSize="56px";const opts=h("div","choice");st.append(p,opts);
 const nx=()=>{if(k>=10){c.after(300,c.end);return}const[e,a]=qs[k];c.info("Arvoitus "+(k+1)+"/10");p.textContent=e;opts.replaceChildren();shuffle([a,...shuffle(Q.filter(q=>q[1]!==a).map(q=>q[1])).slice(0,3)]).forEach(o=>{const b=h("button","btn",o);b.style.fontSize="15px";b.onclick=()=>{[...opts.children].forEach(x=>x.disabled=true);if(o===a){b.classList.add("mint");c.add(1,p)}else{b.classList.add("primary");sfx.bad();[...opts.children].find(x=>x.textContent===a).classList.add("mint")}k++;c.after(800,nx)};opts.append(b)})};nx()}

function gSnake(st,c){c.info("Pyyhkäise tai käytä nuolia");const N=15;const{cv,g,W,H}=canvasIn(st,1);const sz=Math.min(W,H)/N;let sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}],dir={x:1,y:0},nd=dir,food,acc=0,tick=.17,dead=false;const F=["🍓","🍎","🍒","🧁","🍬"];let fe=pick(F);
 const place=()=>{do{food={x:rnd(N),y:rnd(N)}}while(sn.some(s=>s.x===food.x&&s.y===food.y));fe=pick(F)};place();
 const setD=d=>{const m={L:{x:-1,y:0},R:{x:1,y:0},U:{x:0,y:-1},D:{x:0,y:1}}[d];if(m&&(m.x!==-dir.x||m.y!==-dir.y))nd=m};swipe(cv,setD);c.key(e=>{const d=ARROWS[e.key];if(d){e.preventDefault();setD(d)}});
 const pad=h("div","dpad");[["",""],["U","▲"],["",""],["L","◀"],["D","▼"],["R","▶"]].forEach(([d,t])=>{if(!d){pad.append(h("span"));return}const b=h("button",null,t);b.onpointerdown=e=>{e.preventDefault();setD(d)};pad.append(b)});st.append(pad);
 const mint=css("--mint"),acn=css("--accent");
 c.loop(dt=>{if(dead)return;acc+=dt;if(acc>=tick){acc=0;dir=nd;const hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||sn.some(s=>s.x===hd.x&&s.y===hd.y)){dead=true;sfx.bad();buzz(80);c.after(800,c.end);return}sn.unshift(hd);if(hd.x===food.x&&hd.y===food.y){c.add(1);tick=Math.max(.08,tick-.005);place()}else sn.pop()}
  g.clearRect(0,0,W,H);sn.forEach((s,i)=>{g.fillStyle=i?mint:acn;g.beginPath();g.roundRect(s.x*sz+1,s.y*sz+1,sz-2,sz-2,sz*.35);g.fill()});g.font=(sz*.85)+"px serif";g.textAlign="center";g.textBaseline="middle";g.fillText(fe,food.x*sz+sz/2,food.y*sz+sz/2+1)})}
