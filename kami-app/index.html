/* Layout: full-bleed vertical feed (TikTok) with Tinder swipes. Story-progress bar on top, action rail on the right, one card fills the stage. Deliberately one dark "night feed" world; every topic owns a colour field. */
:root{

  --f-old:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px}

/* top bar */
.prog{display:flex;gap:3px;height:3px}
.prog i{flex:1;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i.done{background:var(--ink)}
.prog i.now{background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%)}
.barrow{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--f-hype);font-size:20px;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.logo b{font-family:var(--f-old);font-weight:800;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--pop);color:#fff;font-size:15px}
.tools{display:flex;gap:6px;align-items:center;font-size:13px}
.tools .pill{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools button.pill[aria-pressed="true"]{background:var(--volt);color:#111;border-color:var(--volt);font-weight:700}

/* stage */
.stage{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--bg);color:var(--fg,var(--ink));touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s;will-change:transform}
.card.drag{transition:none}
.card.enter{transform:translateY(100%)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 100% 0%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 65%),radial-gradient(70% 40% at 0% 100%,rgba(0,0,0,.35),transparent 70%);pointer-events:none}
.face{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:18px 74px 20px 20px;transition:opacity .25s,transform .25s}
.face.back{opacity:0;transform:translateY(16px);pointer-events:none;overflow:auto;padding-right:20px;background:color-mix(in srgb,var(--bg) 92%,#000)}
.card.flipped .face.front{opacity:0;transform:translateY(-16px);pointer-events:none}
.card.flipped .face.back{opacity:1;transform:none;pointer-events:auto}
.face.back{touch-action:pan-y}
.card.flipped .rail{display:none}
.ctop{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.04em}
.ctop span{background:rgba(0,0,0,.28);border-radius:99px;padding:4px 10px;white-space:nowrap}
.ctop .ty{background:var(--acc);color:#111}
.mid{margin-block:auto;display:grid;gap:14px}
.hook{margin:0;font-size:clamp(30px,8.6vw,44px);line-height:1.08;text-wrap:balance;font-weight:900;letter-spacing:-.01em}
.ty-vanha .hook,.ty-kansa .hook{font-family:var(--f-old);font-weight:800;letter-spacing:0}
.ty-tsemppi .hook{font-family:var(--f-hype);font-weight:400;text-transform:uppercase;font-size:clamp(28px,8vw,40px)}
.src{margin:0;font-size:14px;color:var(--dim);display:flex;gap:6px;align-items:baseline}
.src b{color:var(--acc);font-weight:700}
.tap{font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center}
.tap kbd{font-family:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.lbl{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.learn{margin:0;font-size:18px;line-height:1.45}
.teko{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.row{display:flex;gap:8px;flex-wrap:wrap}
.b{border-radius:12px;padding:10px 14px;font-weight:700;background:var(--ink);color:#111}
.b.ghost{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line)}
.b.acc{background:var(--acc);color:#111}
.help{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.3);border:1px solid var(--line);text-decoration:none;font-size:14px}
.help small{display:block;color:var(--dim);font-size:12px}
.rights{margin:0;font-size:12px;color:var(--dim)}
.biz{display:none;margin:0;font-size:12px;font-weight:700;background:var(--volt);color:#111;border-radius:10px;padding:7px 10px;line-height:1.35}
body.lens .biz{display:block}
.stamp{position:absolute;z-index:6;font-family:var(--f-hype);font-size:30px;padding:2px 14px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none;letter-spacing:.04em;background:rgba(0,0,0,.25)}
.stamp.r{top:70px;left:18px;color:var(--ok);transform:rotate(-12deg)}
.stamp.l{top:70px;right:18px;color:var(--bad);transform:rotate(12deg)}
.stamp.u{bottom:120px;left:50%;transform:translateX(-50%);color:var(--ink)}

/* rail */
.rail{position:absolute;right:10px;bottom:22px;display:grid;gap:14px;z-index:5}
.rail button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink)}
.rail button span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.32);backdrop-filter:blur(6px)}
.rail button[aria-pressed="true"] span{background:var(--pop)}
.rail button:active span{transform:scale(.9)}

/* topic fields */
.t-raha{--bg:#0D3A2D;--acc:#E9C64A}
.t-mieli{--bg:#251C55;--acc:#B6A4FF}
.t-keho{--bg:#7A2A12;--acc:#FFB46B}
.t-irti{--bg:#0B4549;--acc:#7FE6D2}
.t-suhteet{--bg:#651B38;--acc:#FF9EBB}
.t-ura{--bg:#12304D;--acc:#6FD3FF}
.t-uni{--bg:#0E1330;--acc:#F2D98B}
.t-quiz{--bg:#16161A;--acc:#FFE14D}
.t-partner{--bg:#ECEEF1;--acc:#1F6FEB;--fg:#14171C;--dim:rgba(20,23,28,.66);--line:rgba(20,23,28,.18)}
.t-partner .ctop span{background:rgba(20,23,28,.08)} .t-partner .ctop .ty{background:#14171C;color:#fff}
.t-partner .b{background:#14171C;color:#fff} .t-partner .rail button{color:#14171C} .t-partner .rail button span{background:rgba(20,23,28,.08)}
.t-partner .face.back{background:#E2E5EA}
.t-partner::before{display:none}
.pro{display:flex;gap:12px;align-items:center}
.pro .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff;box-shadow:0 0 0 3px var(--acc)}
.pro b{display:block;font-size:16px}
.pro small{color:var(--dim)}
.quote{margin:0;font-family:var(--f-old);font-weight:800;font-size:clamp(26px,7.4vw,36px);line-height:1.2;text-wrap:balance}
.claim{margin:0;font-size:16px;color:var(--dim)}
.claim b{color:var(--ink)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel .b{padding:14px;font-size:16px}
.duel .fake{background:var(--bad);color:#111} .duel .real{background:var(--ok);color:#111}
.verdict{font-family:var(--f-hype);font-size:40px;line-height:1;margin:0}

/* onboarding + end */
.panel{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:8px 6px 16px}
.panel h1{margin:0;font-family:var(--f-hype);font-weight:400;font-size:clamp(38px,11vw,54px);line-height:1;text-wrap:balance}
.panel h1 em{font-style:normal;color:var(--volt)}
.panel h2{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.panel p{margin:0;color:var(--dim);max-width:46ch}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--pop)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:#111;border-color:var(--ink);font-weight:700}
.vibes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vibe{border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:grid;gap:2px;text-align:center;font-size:13px;color:var(--dim)}
.vibe b{font-size:22px;color:var(--ink)}
.vibe[aria-pressed="true"]{border-color:var(--volt);box-shadow:inset 0 0 0 1px var(--volt);color:var(--ink)}
.go{background:var(--volt);color:#111;font-family:var(--f-hype);font-size:20px;border-radius:16px;padding:16px;margin-top:auto}
.go:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-hype);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.stats small{color:var(--dim);font-size:12px}
.tlist{display:grid;gap:6px}
.tlist label{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.tlist input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.arche{font-family:var(--f-hype);font-size:26px;color:var(--volt);line-height:1.1}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;z-index:40;
  padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet{background:#15181C;color:var(--ink);width:100%;max-width:460px;border-radius:22px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto;border:1px solid var(--line)}
.sheet h3{margin:0;font-family:var(--f-hype);font-weight:400;font-size:22px}
.sheet p{margin:0;color:var(--dim)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar i{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i span{display:block;height:100%;background:var(--volt)}
.shot{width:100%;border-radius:14px;border:1px solid var(--line)}
.ta{width:100%;min-height:90px;background:#0D0F12;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.hint{font-size:12px;color:var(--dim);text-align:center;letter-spacing:.02em}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translate(-50%,-180%);background:var(--ink);color:#111;padding:9px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:50;transition:transform .3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function dayStr(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

let S=fresh();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(fresh(),s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- deck building ---------- */
function allowedType(ty){return S.vibe==="viisas"?ty!=="tsemppi":true}
function typeBoost(ty){return S.vibe==="tsemppi"?({tsemppi:3,kansa:1.5,nyky:1,vanha:.6})[ty]:1}
function wOf(top){return S.w[top]??3}
function pickCards(n,exclude){
  let pool=C.filter(c=>S.topics.includes(c.top)&&allowedType(c.ty)&&!exclude.has(c.id));
  let fresh=pool.filter(c=>!S.seen[c.id]);
  if(fresh.length<n){pool.forEach(c=>delete S.seen[c.id]);fresh=pool}
  const out=[];let last="";
  while(out.length<n&&fresh.length){
    const scored=fresh.map(c=>({c,s:wOf(c.top)*typeBoost(c.ty)*(c.top===last?.35:1)*(0.4+Math.random())})).sort((a,b)=>b.s-a.s);
    const c=scored[0].c;out.push(c.id);last=c.top;fresh=fresh.filter(x=>x!==c);
  }
  return out;
}
function topTopic(){const ts=S.topics.filter(t=>PARTNER[t]);if(!ts.length)return null;return ts.sort((a,b)=>wOf(b)-wOf(a))[0]}
function buildDay(){
  const deck=[];const ex=new Set();
  const pend=S.tekos.find(t=>!t.done&&t.day<dayStr()&&!t.asked);
  if(pend){deck.push("chk:"+pend.id);pend.asked=true}
  const cs=pickCards(5,ex);cs.forEach(id=>ex.add(id));
  const q=QUIZ.find(q=>!S.answered[q.id])||QUIZ[Math.floor(Math.random()*QUIZ.length)];
  const tp=topTopic();const p=tp?"p:"+tp:null;
  deck.push(cs[0],cs[1],"q:"+q.id,cs[2],p,cs[3],cs[4]);
  S.deck=deck.filter(Boolean);S.pos=0;S.day=dayStr();save();
}
function addCards(n){const ex=new Set(S.deck);const cs=pickCards(n,ex);S.deck.push(...cs);save()}

/* ---------- render ---------- */
function prog(){const p=$("prog");if(!S.on||!S.deck.length){p.innerHTML="";return}
  p.innerHTML=S.deck.map((_,i)=>`<i class="${i<S.pos?"done":i===S.pos?"now":""}"></i>`).join("");}
function hud(){$("streak").textContent="🔥 "+S.streak;$("lensBtn").setAttribute("aria-pressed",String(S.lens));document.body.classList.toggle("lens",S.lens);prog()}
function resolve(key){
  if(key.startsWith("q:")) return {kind:"quiz",...QUIZ.find(q=>q.id===key.slice(2))};
  if(key.startsWith("p:")) {const t=key.slice(2);return {kind:"partner",top:t,id:key,...PARTNER[t]}}
  if(key.startsWith("chk:")) {const t=S.tekos.find(x=>x.id===key.slice(4));return t?{kind:"checkin",id:key,teko:t}:null}
  return {kind:"card",...C.find(c=>c.id===key)};
}

let cur=null,flipped=false;
function show(){
  hud();
  if(S.pos>=S.deck.length){endScreen();return}
  cur=resolve(S.deck[S.pos]);flipped=false;
  if(!cur||(cur.kind==="card"&&!cur.id)){S.pos++;return show()}
  if(cur.kind==="card"){S.seen[cur.id]=S.day}
  $("hint").hidden=false;
  $("stage").innerHTML=cardHTML(cur);
  const el=$("stage").querySelector(".card");
  el.classList.add("enter");requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("enter")));
  bind(el);save();
}
function advance(dir){
  const el=$("stage").querySelector(".card");
  const tr={up:"translateY(-110%)",right:"translateX(130%) rotate(18deg)",left:"translateX(-130%) rotate(-18deg)"}[dir];
  if(el){el.style.transform=tr;el.style.opacity=".2"}
  S.pos++;save();setTimeout(show,260);
}

function bind(el){
  let sx=0,sy=0,dx=0,dy=0,on=false;
  const st={r:el.querySelector(".stamp.r"),l:el.querySelector(".stamp.l"),u:el.querySelector(".stamp.u")};
  el.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,input,textarea"))return;on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;el.classList.add("drag");try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;const h=Math.abs(dx)>Math.abs(dy);
    if(h){el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`}else{el.style.transform=`translateY(${Math.min(dy,0)}px)`}
    st.r.style.opacity=h&&dx>0?Math.min(dx/90,1):0;st.l.style.opacity=h&&dx<0?Math.min(-dx/90,1):0;st.u.style.opacity=!h&&dy<0?Math.min(-dy/90,1):0;});
  const end=()=>{if(!on)return;on=false;el.classList.remove("drag");Object.values(st).forEach(s=>s.style.opacity=0);
    const h=Math.abs(dx)>Math.abs(dy);
    if(Math.abs(dx)<8&&Math.abs(dy)<8){el.style.transform="";act("flip");return}
    if(h&&dx>90)act("right");else if(h&&dx<-90)act("left");else if(!h&&dy<-80)act("up");else el.style.transform="";};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b){e.stopPropagation();act(b.dataset.a)}});
}
function bump(top,d){S.w[top]=Math.max(.5,Math.min(9,wOf(top)+d))}
function act(a){
  if(!cur)return;
  const k=cur.kind;
  if(k==="quiz"){
    const answered=!!S.answered[cur.id]&&S.answered[cur.id].day===S.day&&S.answered[cur.id].pos===S.pos;
    if(!answered){
      if(a==="right"||a==="real")return answerQuiz(true);
      if(a==="left"||a==="fake")return answerQuiz(false);
      if(a==="up"){toast("Arvaa ensin: 👈 feikki vai aito 👉");resetCard();return}
      resetCard();return;
    }
    if(["up","right","left","next"].includes(a))return advance(a==="next"?"up":a);
    if(a==="img")return shareImg();
    if(a==="send")return sendFriend();
    return;
  }
  if(k==="checkin"){
    if(a==="right"||a==="chkyes"){markTeko(cur.teko,true);toast("🔥 Lupaus pidetty!");return advance("right")}
    if(a==="left"||a==="chkno"){toast("Ei haittaa. Tänään uusi mahdollisuus.");return advance("left")}
    if(a==="up")return advance("up");resetCard();return;
  }
  switch(a){
    case "flip":{const el=$("stage").querySelector(".card");flipped=!flipped;el.classList.toggle("flipped",flipped);if(k==="card")bump(cur.top,.25);break}
    case "like":case "right":{
      if(k==="card"){if(!S.likes.includes(cur.id))S.likes.unshift(cur.id);S.likes=S.likes.slice(0,300);bump(cur.top,1);toast("❤️ Lisätty Viisaus-DNA:han")}
      else if(k==="partner"){toast("❤️ Tallennettu")}
      if(a==="right")return advance("right");
      const lb=$("stage").querySelector('[data-a="like"]');lb&&lb.setAttribute("aria-pressed","true");save();break}
    case "left":{if(k==="card")bump(cur.top,-.6);return advance("left")}
    case "up":return advance("up");
    case "done":{const t=addTeko(cur,true);toast("🔥 Teko tehty! Putki: "+S.streak);setTimeout(()=>advance("up"),450);break}
    case "later":{addTeko(cur,false);toast("📌 Kysyn huomenna, teitkö");setTimeout(()=>advance("up"),450);break}
    case "send":sendFriend();break;
    case "img":shareImg();break;
    case "cta":ctaSheet();break;
  }
  save();
}
function resetCard(){const el=$("stage").querySelector(".card");if(el)el.style.transform=""}
function addTeko(c,done){let t=S.tekos.find(x=>x.id===c.id&&x.day===S.day);if(!t){t={id:c.id,top:c.top,t:c.t,day:S.day,done:false};S.tekos.unshift(t);S.tekos=S.tekos.slice(0,120)}
  if(done)markTeko(t,true);bump(c.top,1.5);save();return t}
function markTeko(t,done){t.done=done;if(!done)return;const today=dayStr();
  if(S.lastTeko===today)return;S.streak=S.lastTeko===dayStr(-1)?S.streak+1:1;S.lastTeko=today;hud();save()}
function answerQuiz(saidReal){
  const ok=saidReal===cur.real;S.answered[cur.id]={day:S.day,pos:S.pos,ok};S.quiz.n++;if(ok)S.quiz.ok++;save();
  const el=$("stage").querySelector(".card");el.style.transform="";
  $("verdict").innerHTML=`<div class="ctop"><span>🕵️ Tosi vai feikki?</span></div>
    <p class="verdict" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"OIKEIN!":"VIPUUN MENI!"}</p>
    <p class="teko">${cur.real?"✅ AITO":"❌ FEIKKI"}: “${esc(cur.q)}”</p>
    <p class="learn">${esc(cur.x)}</p>
    <p class="rights">Sinun tuloksesi: ${S.quiz.ok}/${S.quiz.n} oikein</p>
    <p class="biz">${BIZ.quiz}</p>
    <div class="row" style="margin-top:auto"><button class="b acc" data-a="next">Seuraava ↑</button><button class="b ghost" data-a="img">🖼️ Haasta kaveri</button></div>`;
  flipped=true;el.classList.add("flipped");
}

/* ---------- sheets ---------- */
function sheet(html,mount){$("host").innerHTML=`<div class="veil"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const v=$("host").firstChild;v.addEventListener("click",e=>{if(e.target===v)closeSheet()});mount&&mount(v);const f=v.querySelector("button");f&&f.focus()}
function closeSheet(){$("host").innerHTML=""}
function ctaSheet(){
  sheet(`<h3>🤝 Ammattilaisen ovi</h3><p>Valmiissa tuotteessa tästä avautuisi ${esc(cur.who||"ammattilaisen")} ajanvaraus. Demossa varausta ei tehdä.</p>
    <p class="biz" style="display:block">${cur.biz||""}</p>
    <p>Näin se toimii: kortti antaa ilmaisen vinkin, ja ammattilainen maksaa vasta toteutuneesta tapaamisesta. Kumppani valitaan kortin aiheen perusteella, joten profiiliasi ei myydä kenellekään.</p>
    <div class="row"><button class="b" id="x">Selvä</button></div>`,v=>v.querySelector("#x").onclick=closeSheet);
}
function sendText(){const c=cur;if(!c)return "";const line=c.kind==="quiz"?`Tosi vai feikki? “${c.q}” – ${c.who}`:`“${c.h}” – ${c.s||c.who}`;return line+"\n\nTämä kortti on sulle. 🃏 KAMI · 7 korttia päivässä"}
function sendFriend(onUnlock){
  const txt=sendText();
  const unlocked=()=>{if(S.bonusDay!==S.day){S.bonusDay=S.day;addCards(3);prog();onUnlock&&setTimeout(onUnlock,700);return "+3 korttia avattu tälle päivälle 🎁"}return ""};
  const fallback=()=>sheet(`<h3>✈️ Lähetä kaverille</h3><p>Kopioi teksti ja lähetä se WhatsAppissa, Instagramissa tai missä haluat.</p><textarea class="ta" id="tx" readonly>${esc(txt)}</textarea><div class="row"><button class="b" id="x">Valmis</button></div>`,v=>{const ta=v.querySelector("#tx");ta.focus();ta.select();v.querySelector("#x").onclick=()=>{closeSheet();const u=unlocked();toast(u||"Lähetetty!")}});
  try{navigator.clipboard.writeText(txt).then(()=>{const u=unlocked();toast("Kopioitu! "+(u||"Liitä viestiin."))},fallback)}catch(e){fallback()}
}

/* ---------- images ---------- */
function wrap(x,text,X,Y,maxW,lh){const words=String(text).split(" ");let line="",lines=[];for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}lines.push(line);lines.forEach((l,i)=>x.fillText(l,X,Y+i*lh));return Y+lines.length*lh}
const COL={raha:["#0D3A2D","#E9C64A"],mieli:["#251C55","#B6A4FF"],keho:["#7A2A12","#FFB46B"],irti:["#0B4549","#7FE6D2"],suhteet:["#651B38","#FF9EBB"],ura:["#12304D","#6FD3FF"],uni:["#0E1330","#F2D98B"],quiz:["#16161A","#FFE14D"],partner:["#14171C","#5B9BFF"]};
async function fonts(){try{await Promise.all(['64px "Dela Gothic One"','800 64px "Shippori Mincho"','900 64px "Zen Kaku Gothic New"','500 40px "Zen Kaku Gothic New"'].map(f=>document.fonts.load(f)))}catch(e){}}
function canvasBase(bg,acc){const cv=document.createElement("canvas");cv.width=1080;cv.height=1920;const x=cv.getContext("2d");
  x.fillStyle=bg;x.fillRect(0,0,1080,1920);const g=x.createRadialGradient(1080,0,40,1080,0,1100);g.addColorStop(0,acc+"88");g.addColorStop(1,acc+"00");x.fillStyle=g;x.fillRect(0,0,1080,1920);
  x.textBaseline="top";return [cv,x]}
function footer(x,acc){x.fillStyle=acc;x.font='700 40px "Zen Kaku Gothic New"';x.fillText("神 KAMI",90,1730);x.fillStyle="rgba(246,244,239,.7)";x.font='500 34px "Zen Kaku Gothic New"';x.fillText("7 korttia päivässä · vedä omasi",90,1790)}
async function shareImg(){
  const c=cur;if(!c)return;await fonts();
  const key=c.kind==="quiz"?"quiz":c.kind==="partner"?"partner":c.top||c.teko?.top||"raha";
  const [bg,acc]=COL[key];const [cv,x]=canvasBase(bg,acc);
  x.fillStyle=acc;x.font='700 40px "Zen Kaku Gothic New"';
  if(c.kind==="quiz"){
    x.fillText("🕵️ TOSI VAI FEIKKI?",90,200);x.fillStyle="#F6F4EF";x.font='800 84px "Shippori Mincho"';
    const y=wrap(x,"“"+c.q+"”",90,330,900,108);x.fillStyle="rgba(246,244,239,.75)";x.font='500 46px "Zen Kaku Gothic New"';wrap(x,"– väitetysti "+c.who,90,y+50,900,60);
    x.fillStyle=acc;x.font='64px "Dela Gothic One"';x.fillText("ARVAA ENNEN KUIN",90,1440);x.fillText("KATSOT VASTAUKSEN",90,1520);
  }else{
    const label=c.kind==="card"?TOP[c.top][1].toUpperCase()+" · "+TYPE[c.ty][1].toUpperCase():"KUMPPANIN VINKKI";
    x.fillText(label,90,200);x.fillStyle="#F6F4EF";
    x.font=c.ty==="tsemppi"?'92px "Dela Gothic One"':(c.ty==="vanha"||c.ty==="kansa")?'800 96px "Shippori Mincho"':'900 96px "Zen Kaku Gothic New"';
    const y=wrap(x,c.ty==="tsemppi"?c.h.toUpperCase():c.h,90,330,900,c.ty==="tsemppi"?116:118);
    x.fillStyle="rgba(246,244,239,.75)";x.font='500 44px "Zen Kaku Gothic New"';const y2=wrap(x,"— "+(c.s||c.who),90,y+40,900,58);
    if(c.t){x.fillStyle=acc;x.font='700 46px "Zen Kaku Gothic New"';x.fillText("⚡ TEKO 2 MIN",90,Math.max(y2+120,1280));x.fillStyle="#F6F4EF";x.font='500 46px "Zen Kaku Gothic New"';wrap(x,c.t,90,Math.max(y2+190,1350),900,60)}
  }
  footer(x,acc);imgSheet(cv,"Korttikuva 9:16 Storiesiin, Reelsiin ja TikTokiin");
}
function imgSheet(cv,cap){let url;try{url=cv.toDataURL("image/png")}catch(e){toast("Kuvan teko epäonnistui");return}
  sheet(`<h3>🖼️ ${cap}</h3><img class="shot" src="${url}" alt="Jaettava kuva"><p>Puhelimessa: pidä kuvaa pohjassa ja tallenna. Tietokoneella: oikea klikkaus → Tallenna kuva.</p><div class="row"><button class="b" id="x">Sulje</button></div>`,v=>v.querySelector("#x").onclick=closeSheet)}

/* ---------- DNA ---------- */
function dna(){
  const L=S.likes.map(id=>C.find(c=>c.id===id)).filter(Boolean);
  const byT={},byY={};L.forEach(c=>{byT[c.top]=(byT[c.top]||0)+1;byY[c.ty]=(byY[c.ty]||0)+1});
  const tt=Object.entries(byT).sort((a,b)=>b[1]-a[1]),yy=Object.entries(byY).sort((a,b)=>b[1]-a[1]);
  const name=L.length?ADJ[yy[0][0]]+" "+NOUN[tt[0][0]]:"Vielä siemen 🌰";
  return {L,byT,byY,tt,yy,name}
}
function dnaSheet(){
  const d=dna();const max=Math.max(1,...Object.values(d.byT));
  const bars=Object.keys(TOP).map(t=>`<div class="bar"><span>${TOP[t][0]} ${TOP[t][1]}</span><i><span style="width:${(d.byT[t]||0)/max*100}%"></span></i><span>${d.byT[t]||0}</span></div>`).join("");
  const types=Object.keys(TYPE).map(t=>`${TYPE[t][0]} ${d.byY[t]||0}`).join(" · ");
  sheet(`<p class="lbl" style="color:var(--pop)">🧬 Viisaus-DNA</p><div class="arche">${esc(d.name)}</div>
    <p>${d.L.length?`Rakennettu ${d.L.length} osuneesta kortista.`:"Swipeä ❤️ kortteja, niin DNA alkaa muodostua."}</p>
    <div class="bars">${bars}</div><p>${types}</p>
    <div class="stats"><div><b>${S.streak}</b><small>teko-putki</small></div><div><b>${S.tekos.filter(t=>t.done).length}</b><small>tekoa</small></div><div><b>${S.quiz.n?Math.round(S.quiz.ok/S.quiz.n*100):0}%</b><small>feikkitutka</small></div></div>
    <p class="biz" style="${S.lens?"display:block":""}">🔁 Wrapped-silmukka: kuukausittainen DNA-kuva jaetaan someen, kuten Spotify Wrapped. Jokainen jako on ilmainen mainos.</p>
    <div class="row"><button class="b acc" id="img">🖼️ Tee DNA-kuva</button><button class="b ghost" id="x">Sulje</button></div>`,v=>{
      v.querySelector("#x").onclick=closeSheet;v.querySelector("#img").onclick=async()=>{await fonts();const [cv,x]=canvasBase("#14101F","#FF4D6D");
        x.fillStyle="#FF4D6D";x.font='700 42px "Zen Kaku Gothic New"';x.fillText("🧬 MUN VIISAUS-DNA",90,200);
        x.fillStyle="#FFE14D";x.font='96px "Dela Gothic One"';const y=wrap(x,d.name.toUpperCase(),90,300,900,116);
        let yy=Math.max(y+80,640);Object.keys(TOP).forEach(t=>{x.fillStyle="#F6F4EF";x.font='500 44px "Zen Kaku Gothic New"';x.fillText(TOP[t][1],90,yy);x.fillStyle="rgba(255,255,255,.12)";x.fillRect(380,yy+10,610,30);x.fillStyle="#FFE14D";x.fillRect(380,yy+10,610*((d.byT[t]||0)/max),30);yy+=92});
        x.fillStyle="#F6F4EF";x.font='500 44px "Zen Kaku Gothic New"';x.fillText(`🔥 ${S.streak} pv putki · 🕵️ feikkitutka ${S.quiz.n?Math.round(S.quiz.ok/S.quiz.n*100):0} %`,90,yy+40);
        footer(x,"#FF4D6D");imgSheet(cv,"DNA-kuva jakoon");}});
}

/* ---------- onboarding & end ---------- */
function onboarding(){
  $("hint").hidden=true;cur=null;prog();
  const sel=new Set(S.topics);let vibe=S.vibe;
  $("stage").innerHTML=`<section class="panel">
    <span class="eyebrow">7 korttia päivässä. Sitten loppuu.</span>
    <h1>Viisautta <em>swipeillä.</em></h1>
    <p>Vanhaa viisautta, tutkittua tietoa ja kansan sananlaskuja. Jokaisessa kortissa on 15 sekunnin oppi ja 2 minuutin teko. Sitten jatkat päivääsi.</p>
    <h2>Mihin kaipaat potkua?</h2>
    <div class="chips">${Object.keys(TOP).map(t=>`<button class="chip" data-t="${t}" aria-pressed="${sel.has(t)}">${TOP[t][0]} ${TOP[t][1]}${TOPSUB[t]?` <small style="opacity:.7">(${TOPSUB[t]})</small>`:""}</button>`).join("")}</div>

    <div class="vibes">
      <button class="vibe" data-v="viisas" aria-pressed="${vibe==="viisas"}"><b>🏛️</b>Viisas<br>rauhallinen</button>
      <button class="vibe" data-v="mix" aria-pressed="${vibe==="mix"}"><b>🎲</b>Sekoitus<br>vähän kaikkea</button>
      <button class="vibe" data-v="tsemppi" aria-pressed="${vibe==="tsemppi"}"><b>🥊</b>Tsemppi<br>hype päälle</button>
    </div>

function endScreen(){
  $("hint").hidden=true;cur=null;prog();
  const todays=S.tekos.filter(t=>t.day===S.day);const d=dna();
  $("stage").innerHTML=`<section class="panel">
    <span class="eyebrow">Päivän seiska paketissa</span>

    <p>Olet tänään: <b style="color:var(--volt)">${esc(d.name)}</b>. Uusi seiska aukeaa huomenna aamulla.</p>
    <p class="biz">🔒 Päiväraja on tuotteen ydin. Niukkuus tuo käyttäjän takaisin huomenna, jakaminen avaa +3 korttia ja KAMI+ poistaa rajan. Kilpailijat eivät voi kopioida tätä syömättä omaa ruutuaikamalliaan.</p>
    <div class="row">
      ${S.bonusDay!==S.day?`<button class="b acc" id="bonus">✈️ Lähetä kortti kaverille → +3 korttia</button>`:""}
      <button class="b ghost" id="dnaE">🧬 Viisaus-DNA</button>
      <button class="b ghost" id="plus">Jatka rajatta (KAMI+ · demo)</button>
    </div>
    <button class="b ghost" id="topics" style="justify-self:start">⚙️ Vaihda aiheita</button>
  </section>`;
  $("stage").querySelectorAll(".tlist input").forEach(cb=>cb.onchange=()=>{const t=S.tekos[+cb.dataset.i];if(cb.checked){markTeko(t,true);toast("🔥 Teko tehty!")}else{t.done=false;save()}});
  const b=$("bonus");if(b)b.onclick=()=>{cur=resolve(S.deck[S.deck.length-1]);sendFriend(()=>{if(S.pos<S.deck.length)show()});cur=null};
  $("dnaE").onclick=dnaSheet;$("topics").onclick=onboarding;
  $("plus").onclick=()=>{S.plusDay=S.day;addCards(7);toast("KAMI+ demo: 7 korttia lisää");show()};
}

/* ---------- wiring ---------- */
$("lensBtn").onclick=()=>{S.lens=!S.lens;hud();save();toast(S.lens?"€ Bisneslinssi päällä: katso keltaiset laput":"€ Bisneslinssi pois")};
$("dnaBtn").onclick=dnaSheet;$("logo").onclick=onboarding;
addEventListener("keydown",e=>{if($("host").innerHTML){if(e.key==="Escape")closeSheet();return}if(!cur)return;
  const m={ArrowRight:"right",ArrowLeft:"left",ArrowUp:"up"," ":"flip",Enter:"flip"}[e.key];if(!m||e.target.closest("input,textarea"))return;if(m==="flip"&&e.target.closest("button,a"))return;e.preventDefault();act(m)});
function boot(data){
  load();if(data&&data.S)S=Object.assign(fresh(),data.S);
  window.claude?.hot?.snapshot?.(()=>({S}));
  if(!S.on){onboarding();hud();return}
  if(S.day!==dayStr())buildDay();
  show();
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
